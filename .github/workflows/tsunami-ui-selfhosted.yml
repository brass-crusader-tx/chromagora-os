name: TSUNAMI UI Genesis Public Self Hosted

on:
  workflow_dispatch:
  push:
    branches:
      - build/tsunami-ui-genesis-20260925
    paths:
      - ".github/workflows/tsunami-ui-selfhosted.yml"
      - "tsunami-builder/MIRROR-MANIFEST.json"

concurrency:
  group: tsunami-ui-genesis-selfhosted
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify current mirror binding
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path("tsunami-builder")
          manifest=json.loads((root/"MIRROR-MANIFEST.json").read_text())
          bad=[]
          for row in manifest["files"]+manifest["support_files"]:
              p=root/row["path"]
              actual=subprocess.check_output(["git","hash-object",str(p)],text=True).strip() if p.is_file() else "missing"
              if actual!=row["git_blob_sha"]: bad.append((row["path"],actual,row["git_blob_sha"]))
          assert not bad,bad
          print("MIRROR_BINDING=PASS",manifest["source_head"],len(manifest["files"]),len(manifest["support_files"]))
          PY

      - name: Canonical static and state gates
        working-directory: tsunami-builder
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/ui_shell_static_check.py
          python3 ui-shell/tools/source_verify.py
          python3 ui-shell/tools/accessibility_verify.py
          if command -v kotlinc >/dev/null; then bash ui-shell/tools/jvm_state_gate.sh; fi

      - name: Canonical host build
        working-directory: tsunami-builder
        shell: bash
        run: |
          set -euxo pipefail
          bash ui-shell/tools/build_host.sh
          test -s dist/TSUNAMI-UI-Genesis-debug.apk
          test -s dist/TSUNAMI-UI-Genesis-debug-androidTest.apk
          cat build/reports/tsunami/ui-shell/host/build.txt

      - name: Motorola acceptance if attached
        working-directory: tsunami-builder
        shell: bash
        run: |
          set -euxo pipefail
          SERIAL=ZY22L2PTS5
          if command -v adb >/dev/null && adb devices | awk 'NR>1 && $2=="device"{print $1}' | grep -qx "$SERIAL"; then
            bash ui-shell/tools/build_host.sh --verify-device "$SERIAL"
            grep -q '^DEVICE_VERIFY=PASS' build/reports/tsunami/ui-shell/host/build.txt
            grep -q '^VISUAL_CAPTURE=PASS states=45' build/reports/tsunami/ui-shell/host/build.txt
            grep -q '^VISUAL_SANITY=PASS' build/reports/tsunami/ui-shell/host/build.txt
            grep -q '^CRASH_SCAN=PASS' build/reports/tsunami/ui-shell/host/build.txt
          else
            echo "MOTOROLA=NOT_ATTACHED"
          fi

      - name: Publish exact-source shell preview to Chromagora Dev Portal
        working-directory: tsunami-builder
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PWD/dist/TSUNAMI-UI-Genesis-debug.apk"
          PORTAL_ROOT="/Users/ezra/Downloads/TSUNAMI"
          TARGET="$PORTAL_ROOT/dist/TSUNAMI-UI-Shell-Rebrand-v1-debug.apk"
          META="$TARGET.json"
          if [[ ! -s "$SRC" ]]; then
            echo "PORTAL_PUBLISH=SKIP apk_missing"
            exit 0
          fi
          if [[ ! -d "$PORTAL_ROOT/dist" ]]; then
            echo "PORTAL_PUBLISH=SKIP primary_checkout_not_mounted"
            exit 0
          fi
          source_head="$(python3 - <<'PY'
          import json
          print(json.load(open("MIRROR-MANIFEST.json"))["source_head"])
          PY
          )"
          tmp="$TARGET.tmp.$"
          cp "$SRC" "$tmp"
          chmod 0644 "$tmp"
          mv -f "$tmp" "$TARGET"
          sha="$(shasum -a 256 "$TARGET" | awk '{print $1}')"
          bytes="$(stat -f%z "$TARGET")"
          device_verified=false
          if grep -q '^DEVICE_VERIFY=PASS' build/reports/tsunami/ui-shell/host/build.txt 2>/dev/null; then
            device_verified=true
          fi
          python3 - "$META" "$TARGET" "$sha" "$bytes" "$source_head" "$GITHUB_SHA" "$device_verified" <<'PY'
          import datetime,json,pathlib,sys
          meta,target,sha,bytes_,source_head,mirror_commit,device_verified=sys.argv[1:]
          payload={
            "artifact":"TSUNAMI UI Genesis",
            "package":"com.tsunami.shell",
            "portal_path":target,
            "bytes":int(bytes_),
            "sha256":sha,
            "source_head":source_head,
            "source_branch":"genesis/ui-shell-20260923",
            "public_mirror_commit":mirror_commit,
            "build_backend":"chromagora-os-self-hosted",
            "backend_free":True,
            "device_verified":device_verified.lower()=="true",
            "published_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path(meta).write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY
          if curl -fsSL --max-time 30 "https://dev.mintiful.dev/download/tsunami-ui-shell-rebrand-v1-apk" -o /tmp/tsunami-ui-portal.apk; then
            live_sha="$(shasum -a 256 /tmp/tsunami-ui-portal.apk | awk '{print $1}')"
            live_bytes="$(stat -f%z /tmp/tsunami-ui-portal.apk)"
            [[ "$live_sha" == "$sha" && "$live_bytes" == "$bytes" ]]
            echo "PORTAL_ROUTE_CHECK=PASS sha256=$live_sha bytes=$live_bytes"
          else
            echo "PORTAL_ROUTE_CHECK=SKIP route_unreachable_from_runner"
          fi
          echo "PORTAL_PUBLISH=PASS source_head=$source_head sha256=$sha bytes=$bytes target=$TARGET"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TSUNAMI-UI-Genesis-public-selfhosted
          path: |
            tsunami-builder/dist/TSUNAMI-UI-Genesis-debug.apk
            tsunami-builder/dist/TSUNAMI-UI-Genesis-debug-androidTest.apk
            tsunami-builder/dist/TSUNAMI-Sans-v5.1/
            tsunami-builder/build/reports/tsunami/ui-shell/host/
            tsunami-builder/ui-shell/tools/proofs/
            tsunami-builder/MIRROR-MANIFEST.json
          if-no-files-found: warn

