name: TSUNAMI UI Genesis Slim Probe

on:
  push:
    branches:
      - build/tsunami-ui-genesis-20260925
    paths:
      - ".github/workflows/tsunami-ui-slim-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Prove slim runner allocation
        shell: bash
        run: |
          set -euxo pipefail
          echo "TSUNAMI_SLIM_RUNNER=PASS"
          uname -a
          python3 --version || true
