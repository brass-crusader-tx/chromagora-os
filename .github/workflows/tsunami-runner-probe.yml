name: TSUNAMI Runner Probe

on:
  push:
    branches:
      - build/tsunami-ui-genesis-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Ubuntu native runner probe
        run: echo RUNNER_PROBE_UBUNTU=PASS
  macos:
    runs-on: macos-latest
    steps:
      - name: macOS native runner probe
        run: echo RUNNER_PROBE_MACOS=PASS
  windows:
    runs-on: windows-latest
    steps:
      - name: Windows native runner probe
        shell: pwsh
        run: Write-Output "RUNNER_PROBE_WINDOWS=PASS"
