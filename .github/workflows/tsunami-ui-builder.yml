name: TSUNAMI UI Genesis Builder

on:
  push:
    branches:
      - build/tsunami-ui-genesis-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Generate TSUNAMI Sans
        working-directory: tsunami-builder/ui-shell
        run: |
          python3 -m pip install --disable-pip-version-check "fonttools==4.63.0" "shapely==2.1.2" "pillow==12.3.0"
          python3 tools/prepare_fonts.py
          test "$(find app/src/main/res/font -name 'tsunami_sans_*.ttf' | wc -l)" -eq 5
          ls -lh app/src/main/res/font

      - name: Assemble shell and instrumentation APKs
        working-directory: tsunami-builder/ui-shell
        run: |
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee build-apk.sha256
          sha256sum app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee test-apk.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TSUNAMI-UI-Genesis-crossrepo
          path: |
            tsunami-builder/ui-shell/app/build/outputs/apk/debug/app-debug.apk
            tsunami-builder/ui-shell/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            tsunami-builder/ui-shell/build-apk.sha256
            tsunami-builder/ui-shell/test-apk.sha256
          if-no-files-found: error
