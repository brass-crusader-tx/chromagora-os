name: Chromagora remote desktop repair

on:
  push:
    branches:
      - ops/chromagora-rd-repair-20260826
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tsunami-rpc")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Submit host diagnostic
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RPC_URL: https://dev.mintiful.dev/tsunami-rpc/execute
        run: |
          set -euo pipefail
          cat > request.json <<'JSON'
          {
            "operation":"tsunami_rpc",
            "conversation_id":"chatgpt-chromagora-rd-20260826",
            "request_id":"chromagora-rd-diag-alt-ingress-20260826",
            "project":"TSUNAMI",
            "independent":true,
            "development_mode":"isolated",
            "priority":"control-plane-repair",
            "validation_tier":"hot",
            "subsystems":["chromagora-dev-portal","novnc","websockify","macos-screen-sharing"],
            "expected_paths":[],
            "resources":["host-light"],
            "auto_integrate":false,
            "promote":false,
            "stages":[{
              "name":"chromagora-rd-diagnostic",
              "type":"shell",
              "timeout":180,
              "command":"set -u; echo '=== TIME ==='; date -u '+%Y-%m-%dT%H:%M:%SZ'; echo '=== USER ==='; id; echo '=== LAUNCHD ==='; launchctl print \\\"gui/$(id -u)\\\" 2>/dev/null | grep -Ei 'novnc|websock|vnc|chromagora|remote|cloudflared|screensharing|tailscale' | head -250 || true; echo '=== PROCESSES ==='; ps ax -o pid=,ppid=,etime=,command= | grep -Ei 'novnc|websock|vnc|chromagora|remote|cloudflared|screensharing|tailscale' | grep -v grep | head -250 || true; echo '=== LISTENERS ==='; lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | grep -Ei ':3300|:5900|:5901|:6080|:6081|:48761|:8765|python|node|cloudflared|websock|vnc|screenshar' | head -250 || true; echo '=== LOCAL HTTP ==='; for u in http://127.0.0.1:3300/remote http://127.0.0.1:48761/ http://127.0.0.1:6080/ http://127.0.0.1:6080/vnc.html; do echo ---$u; curl -ksS --max-time 3 -o /tmp/rd-body.$$ -D - \\\"$u\\\" 2>&1 | head -20; head -c 300 /tmp/rd-body.$$ 2>/dev/null; echo; done; rm -f /tmp/rd-body.$$; echo '=== LAUNCHAGENTS ==='; find \\\"$HOME/Library/LaunchAgents\\\" -maxdepth 1 -type f \\\\( -iname '*novnc*' -o -iname '*vnc*' -o -iname '*chromagora*' -o -iname '*remote*' -o -iname '*tsunami*' \\\\) -print 2>/dev/null | sort || true; echo '=== SCREENSHARING ==='; launchctl print system/com.apple.screensharing 2>&1 | head -120 || true"
            }]
          }
          JSON
          HTTP_CODE="$(curl -sS -o response.json -w '%{http_code}' --connect-timeout 10 --max-time 30 -X POST "$RPC_URL" -H 'Content-Type: application/json' -H "Authorization: Bearer $OIDC_TOKEN" -H 'X-TSUNAMI-Request-ID: chromagora-rd-diag-alt-ingress-20260826' --data-binary @request.json)"
          echo "HTTP $HTTP_CODE"
          cat response.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
