jdk:
  - openjdk17

install:
  # Transport-only JitPack bootstrap. Its Python disables/omits the user site,
  # so install virtualenv into an explicit import path instead of --user.
  # All 58 mirrored TSUNAMI source/support contract files remain byte-identical
  # to private Genesis head 1e65095a651394be923a7aa875cfc3b83a8254f6.
  - python3 -m pip install --disable-pip-version-check --target tsunami-builder/build/.jitpack-python-bootstrap "virtualenv==20.35.4"
  - PYTHONPATH="$PWD/tsunami-builder/build/.jitpack-python-bootstrap" python3 -m virtualenv --system-site-packages tsunami-builder/build/.ui-shell-toolchain/venv
  - test -x tsunami-builder/build/.ui-shell-toolchain/venv/bin/python
  - cd tsunami-builder && bash ui-shell/tools/build_host.sh
  - python3 tsunami-builder/tools/jitpack_publish_apk.py
